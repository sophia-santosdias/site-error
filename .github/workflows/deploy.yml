name: Deploy para GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar config.local.js com secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > js/config.local.js << 'ENDOFFILE'
          // Gerado automaticamente pelo GitHub Actions — não editar.
          window.SITE_CONFIG = Object.assign(window.SITE_CONFIG || {}, {
            comments: {
              url: "SUPABASE_URL_PLACEHOLDER",
              anonKey: "SUPABASE_ANON_KEY_PLACEHOLDER"
            }
          });
          ENDOFFILE
          sed -i "s|SUPABASE_URL_PLACEHOLDER|${SUPABASE_URL}|g" js/config.local.js
          sed -i "s|SUPABASE_ANON_KEY_PLACEHOLDER|${SUPABASE_ANON_KEY}|g" js/config.local.js

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload dos arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
