<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha História</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">
  <div id="progress" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/" id="brand">Minha História</a>
    <div class="tools">
      <button type="button" id="font-down" aria-label="Diminuir fonte">A−</button>
      <button type="button" id="font-up" aria-label="Aumentar fonte">A+</button>
      <select id="theme" aria-label="Tema">
        <option value="light">Luz do dia</option>
        <option value="sepia">Polaroid</option>
        <option value="dark">Câmara escura</option>
      </select>
    </div>
  </header>

  <main id="view" class="container" tabindex="-1"></main>

  <footer class="footer">// feito com código e luz · use ← → para trocar de capítulo</footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
